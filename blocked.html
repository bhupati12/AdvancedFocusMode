<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by Focus Mode</title>
    <link rel="stylesheet" href="blocked.css" />
    <script type="module" src="blocked.js"></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Distraction shield</p>
      <h1>Site blocked during focus mode</h1>
      <p id="message">
        This domain is currently shielded so you can stay on the task in front of
        you.
      </p>
      <div class="actions">
        <button id="back-button" class="primary">Return to focus</button>
        <button id="open-dashboard" class="secondary">Open dashboard</button>
      </div>
    </main>
  </body>
</html>
